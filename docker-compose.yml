# All services use host networking so workers can bind to each public IP
# configured on the server. Postgres listens on 127.0.0.1 only.
services:
  db:
    image: postgres:16
    network_mode: host
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  api:
    build: .
    image: emailval:latest
    network_mode: host
    restart: unless-stopped
    env_file: .env
    # Listens on localhost only; Caddy terminates TLS in front of it.
    command: uvicorn app.api:app --host 127.0.0.1 --port ${API_PORT:-8000} --proxy-headers --forwarded-allow-ips 127.0.0.1
    volumes:
      - ./config:/srv/config:ro
      - ./reports:/srv/reports
    depends_on:
      db: { condition: service_healthy }

  monitor:
    image: emailval:latest
    network_mode: host
    restart: unless-stopped
    env_file: .env
    command: python -m app.monitor
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      API_PORT: ${API_PORT:-8000}
    volumes:
      # TLS_MODE selects deploy/Caddyfile.internal | .public | .custom
      - ./deploy/Caddyfile.${TLS_MODE:-internal}:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
